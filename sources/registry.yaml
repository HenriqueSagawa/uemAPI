# Catálogo de fontes candidatas. Nenhuma entrada está autorizada para coleta
# automatizada ou publicação de dados enquanto status for candidate.
sources:
  campi_uem:
    dataset: campi
    url: "https://www.uem.br/a-uem/campus"
    type: html
    collector: campi
    access: public
    role: primary
    status: candidate
    last_verified: "2026-10-16"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      Conferência documentada em reviews/2026-10-16-campi-centros/README.md,
      com URLs, horários e hashes. O HTML confirma sede em Maringá e conjunto
      de seis municípios regionais. IDs, nomes, siglas e vínculos com municípios
      vêm da tabela local e de fontes de apoio; o coletor não valida os rótulos
      dos links. A conferência dos candidatos não aprova reutilização ou publicação.

  estrutura_uem:
    dataset:
      - campi
      - centros
      - departamentos
    url: "https://www.npd.uem.br/transparencia/organograma/index.html"
    type: html
    collector: null
    access: public
    role: secondary
    status: candidate
    last_verified: "2026-09-25"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: "Mostra a hierarquia institucional; vínculos e nomes devem ser confrontados com páginas das unidades."

  centros_pld:
    dataset:
      - centros
      - departamentos
    url: "https://pld.uem.br/dvl/regulamentos/centros-de-ensino"
    type: html
    collector: centros
    access: public
    role: primary
    status: candidate
    last_verified: "2026-10-16"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      Índice e sete páginas de centros conferidos em 2026-10-16 nos lotes
      reviews/2026-10-16-campi-centros/ e reviews/2026-10-16-departamentos/.
      O índice sustenta nomes, siglas e links; as páginas vinculadas sustentam
      candidatos a departamentos, rótulos e exclusões auditáveis. Em 2026-10-22,
      somente a página do CTC e o documento do DEM foram reconferidos em
      reviews/2026-10-22-pendencias/; isso não atualiza a data do índice inteiro.
      Completude, câmpus, situação atual e reutilização seguem não verificados.

  base_dados_uem:
    dataset:
      - campi
      - centros
      - departamentos
      - cursos
    url: "https://pld.uem.br/lni/base"
    type: html
    collector: null
    access: public
    role: validation
    status: candidate
    last_verified: "2026-09-25"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      Página HTML que lista PDFs anuais. Sua data de verificação permanece
      2026-09-25. O PDF v05-base-de-dados-2024-2025.pdf foi consultado novamente
      em 2026-10-16 para a revisão de câmpus, conforme
      reviews/2026-10-16-campi-centros/capturas.json; essa captura não revalida
      o índice HTML. O relatório usa ano base 2024 e informa direitos reservados.

  cursos_graduacao:
    dataset: cursos
    url: "https://www.pen.uem.br/site/public/cursos"
    type: html
    collector: cursos
    access: public
    role: primary
    status: candidate
    last_verified: "2026-10-22"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      O lote reviews/2026-10-17-cursos/ confere o índice e 67 detalhes presenciais,
      preservando blocos acadêmicos sem inferir ofertas. Em 2026-10-22 foram
      reconferidos o índice e somente o detalhe de Engenharia Agrícola, em
      reviews/2026-10-22-pendencias/. A página conserva Licenciatura, em divergência
      com o PPC vinculado; o candidato foi rejeitado para uso canônico e há uma
      normalização proposta com evidências. Os outros 66 detalhes não foram
      recapturados nessa data. IDs estáveis, EaD, vínculos, completude e reutilização
      continuam pendentes; last_verified registra o índice, não a aprovação do dataset.

  portal_graduacao:
    dataset: cursos
    url: "https://www.uem.br/estude-na-uem/graduacao"
    type: html
    collector: null
    access: public
    role: secondary
    status: candidate
    last_verified: "2026-09-25"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: "Página-resumo informa 80 cursos; conceito de contagem deve ser reconciliado com o catálogo."

  sigaa_publico:
    dataset:
      - centros
      - departamentos
      - cursos
    url: "https://sigs.uem.br/sigaa/public/home.jsf"
    type: html
    collector: null
    access: public
    role: validation
    status: candidate
    last_verified: "2026-09-25"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: "Página pública aponta para consultas acadêmicas; acesso e formato das páginas de resultados ainda precisam de verificação."

  dem_regulamento:
    dataset: departamentos
    url: "https://dem.uem.br/arquivos/resolucoes-dem/resolucao-106-2018-ctc.pdf"
    type: pdf
    collector: null
    access: public
    role: validation
    status: candidate
    last_verified: "2026-10-22"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      Resolução 106/2018-CI/CTC, página PDF 2, Anexo I, art. 1º, sustenta o nome
      Departamento de Engenharia Mecânica (DEM). A cópia do DEM e o arquivo
      vinculado na PLD têm SHA-256 idênticos no lote reviews/2026-10-22-pendencias/.
      O regulamento sustenta a nomenclatura; não foi usado para afirmar status atual.

  engenharia_agricola_ppc:
    dataset: cursos
    url: "https://www.pen.uem.br/site/public/assets/files/19944F3D475A0C509C267FE117F4A9F8/20230524_140812-engenhariaagricola.pdf"
    type: pdf
    collector: null
    access: public
    role: validation
    status: candidate
    last_verified: "2026-10-22"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      PPC atualmente vinculado no detalhe de Engenharia Agrícola da PEN.
      Resolução 042/2022-CI/CCA: página PDF 1 delimita ingressantes a partir de
      2023; página PDF 2, item 1.1, registra Bacharel em Engenharia Agrícola como
      habilitação, e item 1.6 assinala Bacharel. Evidência de normalização em
      reviews/2026-10-22-pendencias/, sem generalizar para outras turmas ou publicar dados.

  daa_ingresso_2026:
    dataset: cursos
    url: "https://daa.uem.br/editais-e-portarias/editais-e-portarias-2025-1/edital-072-2025-daa-processos-especiais-de-ingresso-2026-2a-republicacao.pdf"
    type: pdf
    collector: null
    access: public
    role: validation
    status: candidate
    last_verified: "2026-10-22"
    review_interval_days: null
    reuse_conditions: not_verified
    notes: >-
      Edital 072/2025-DAA, segunda republicação, para ingresso em 2026. Página
      PDF/impressa 16 relaciona Engenharia Agrícola (CAR), Integral, Bacharelado.
      Corrobora a categoria de formação; não substitui o grau profissional
      Engenheiro Agrícola nem comprova ofertas, vagas ou status atuais fora do edital.
      Conferência em reviews/2026-10-22-pendencias/README.md.
